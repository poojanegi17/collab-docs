# Keep the deployed services from going cold.
#
# WHAT THIS IS ACTUALLY FIXING
#
# Two independent suspensions stack on the first visit to an idle site:
#
#   Render   a free-tier web service is spun down after ~15 minutes with no
#            traffic, and the next request has to wait for the container to be
#            scheduled and Node to boot. This is the expensive one -- tens of
#            seconds.
#   Neon     a compute scales to zero after 5 minutes idle, and the first query
#            pays a cold start of a few hundred milliseconds.
#
# Note the ratio before optimising anything else: Render's wake dominates
# Neon's by two orders of magnitude. Only the Render one is worth a cron.
#
# ---------------------------------------------------------------------------
# WHAT AN EARLIER VERSION OF THIS FILE GOT WRONG
#
# It pinged `/api/health` *because* that route queried Postgres, on the theory
# that one request could keep both the Render instance and the Neon compute
# warm. That reasoning treated Neon's scale-to-zero as the enemy. It is not --
# it is the free plan's budget mechanism, and defeating it spends the entire
# monthly allowance on a site with nobody on it:
#
#   Neon     compute never suspends    ~720 h/mo against ~192 h free
#   Render   instance never sleeps     ~730 h/mo against 750 h free, and that
#            750 is ACCOUNT-WIDE -- so collab-ot waking for the lab pushed the
#            pair over and Render suspended both engine servers for the month.
#
# Two fixes, because those are two different quotas:
#
#   1. `/api/health` no longer touches the database. The aggregates moved to
#      `?deep=1`, which nothing automated ever calls. See
#      backend/src/transport/api.js. That alone fixes Neon.
#   2. This cron runs in a WINDOW rather than around the clock, which is the
#      only thing that fixes Render's instance-hours -- a cheap health route
#      does nothing for them, because the container is awake either way.
#
# On the window: Render sleeps after ~15 idle minutes, so a cron at interval N
# keeps the site warm for min(15, N) minutes out of every N. Widening to */45
# would therefore buy a 33% chance of being warm for a third of the cost --
# paying real budget for a coin flip. Better to stay at */10 and be reliably
# warm during the hours a visitor actually arrives.
#
#   '*/10 3-16 * * *'   03:00-16:50 UTC = 08:30-22:35 IST, daily
#                       ~14.1 h/day x 30 = ~423 h/mo, ~330 h of headroom
#
# The hours are UTC and the audience is assumed to be in IST. Both are worth
# revisiting before the window is; the arithmetic above is what generalises.
#
# ---------------------------------------------------------------------------
# WHAT THIS DOES NOT GUARANTEE
#
# GitHub's scheduled runs are best-effort and are routinely delayed by several
# minutes at busy times, so a 10-minute cron against a 15-minute idle timeout
# will occasionally lose the race and let the service sleep. That is accepted:
# the failure mode is one slow visit, which is the status quo, not a breakage.
# A paid uptime pinger is the fix if that ever stops being acceptable.
#
# GitHub also disables scheduled workflows on a repository with no pushes for
# 60 days, and will not tell you it has. If the site starts feeling slow again,
# check the Actions tab before checking the code.
#
# This pings ONE service. `collab-ot` is the lab's second engine and is left to
# sleep -- see ADR-009 for why it carries no real documents. It still wakes on
# demand when someone opens the lab under OT, and those hours come out of the
# same account-wide 750; the window above is sized to leave room for them.
# ---------------------------------------------------------------------------
name: Keep-alive

on:
  schedule:
    # Windowed, not around the clock. See the arithmetic at the top of
    # the file -- around the clock is what exhausted both free tiers.
    - cron: '*/10 3-16 * * *'
  # So you can prove it works without waiting for the cron.
  workflow_dispatch:

# A queued ping is worthless -- if one run is somehow still going, the next
# one's turn has already come round.
concurrency:
  group: keepalive
  cancel-in-progress: true

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    # The URL is a repository VARIABLE, not a secret: it is the public address
    # of a public site, and a secret would only make the logs unreadable.
    #
    # This deployment's value, so nobody has to guess it:
    #
    #     https://collab-yjs-1f8k.onrender.com
    #
    # An ORIGIN, with no trailing slash and no path -- the curl below appends
    # `/api/health` itself. Render generates that `-1f8k` suffix per service,
    # so a fork's URL will differ; the shape is the part to copy.
    env:
      HEALTH_URL: ${{ vars.KEEPALIVE_URL }}
    steps:
      - name: Ping /api/health
        run: |
          if [ -z "$HEALTH_URL" ]; then
            echo "KEEPALIVE_URL is not set -- nothing to ping."
            echo "Set it under Settings > Secrets and variables > Actions > Variables."
            exit 0
          fi
          # --max-time 90, because waking a spun-down instance is the case this
          # exists for and the slow response IS the success. Retries cover the
          # window where Render has accepted the connection but Node is not
          # listening yet, which presents as a 502.
          # No `?deep=1` here. This request must not reach Postgres --
          # that is the whole point of the split, and the reason the
          # window above is affordable.
          curl --silent --show-error --fail \
               --max-time 90 \
               --retry 3 --retry-delay 20 --retry-all-errors \
               --write-out '\nHTTP %{http_code} in %{time_total}s\n' \
               "$HEALTH_URL/api/health"
